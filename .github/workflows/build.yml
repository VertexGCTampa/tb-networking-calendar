name: Build networking calendar

on:
  schedule:
    - cron: "15 10 * * *"   # daily, ~6:15 AM Eastern
  workflow_dispatch:        # "Run workflow" button for an on-demand refresh

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build_calendar.py
      - name: Commit updated calendar
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Calendar refresh $(date -u +%Y-%m-%d)"
          git push
